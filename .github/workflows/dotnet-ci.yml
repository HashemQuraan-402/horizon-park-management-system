name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore and audit dependencies
        run: dotnet restore -p:AuditPipeline=true

      - name: Report vulnerable packages
        run: dotnet list HorizonParkSystem.csproj package --vulnerable --include-transitive

      - name: Build release
        run: dotnet build --configuration Release --no-restore

      - name: Smoke-test console startup
        run: printf '0\n' | dotnet run --configuration Release --no-build